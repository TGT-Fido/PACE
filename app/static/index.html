<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PACE</title><link rel="stylesheet" href="/vendor/pdfjs/pdf_viewer.css"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/maps.css"><link rel="stylesheet" href="/workspace.css"><link rel="stylesheet" href="/v7.css"><script src="/app.js" type="module"></script></head><body>
<header><div class="brand"><span class="logo" aria-hidden="true">⬡<span>⬡</span></span><div><h1 id="title">PACE</h1><p>Projects At a glanCE</p></div></div><div class="header-actions"><span class="project-count"><strong id="total">0</strong> projects</span><span id="sync" role="status" aria-live="polite">Connecting…</span><button id="refresh" title="Rescan the projects folder for added or changed PDFs"><span class="refresh-icon" aria-hidden="true">⟳</span> <span id="refresh-label">Rescan</span></button><button id="gear" aria-label="Settings" title="Settings">⚙</button></div><div class="edition" hidden><b id="year">2026</b><button id="app-version">v7.0.0</button></div></header>
<main id="dashboard"><section class="toolbar" aria-label="Project filters"><div><label for="category">Category</label><select id="category"><option value="">All categories</option></select></div><div><label for="status">Status</label><select id="status"><option value="">All statuses</option></select></div><div><label for="badge-filter">Badge</label><select id="badge-filter"><option value="">All badges</option></select></div><div><label for="color-filter">Color</label><select id="color-filter"><option value="">All colors</option></select></div><button id="clear-filters">Clear filters</button><button id="settings">Customize</button></section>
<section class="searchbar" aria-label="Search projects"><input id="project-search" type="search" placeholder="Search your projects…" aria-label="Search your projects"><select hidden id="search-mode" aria-label="Search scope"><option value="overview">Overview</option><option value="contents">Overview + PDF contents</option></select><button id="bulk-import">Import PDFs</button><button id="create-project">+ New project</button><button hidden id="maintenance">Backup &amp; updates</button></section><p id="project-search-status" role="status"></p><section id="content-results" aria-label="PDF search matches"></section><div id="error" role="alert" hidden></div><div id="warnings"></div><section class="view-switcher" aria-label="Project views"><label for="view-choice">Layout</label><select id="view-choice"><option value="cards">Cards</option><option value="canvas">Canvas</option><option value="radial">Radial Map</option><option value="roadmap">Roadmap</option></select><button id="set-startup">Set as startup layout</button><span id="view-save-status" role="status"></span></section><section id="map-view" hidden aria-label="Visual project map"></section><div class="sectionline" id="cards-sectionline"><h2>Your projects</h2><span id="range"></span></div><section id="cards" aria-label="Projects"></section><nav id="pagination" aria-label="Project pages"></nav><footer><span class="local-dot">Local workspace · Your PDFs, your history</span><span>Checks every 15 seconds while the dashboard is visible.</span></footer></main>
<main id="document-view" hidden><div class="document-heading"><button id="back-dashboard">← Projects</button><div><h2 id="document-title">Project</h2><p id="document-filename"></p></div><button id="document-history">History</button></div>
<div class="viewer-toolbar" aria-label="Document controls"><div class="control-group"><button id="previous-page" aria-label="Previous page">‹</button><label class="sr-only" for="page-number">Page number</label><input id="page-number" type="number" min="1" value="1"><span>/ <span id="page-count">—</span></span><button id="next-page" aria-label="Next page">›</button></div><div class="control-group"><button id="zoom-out" aria-label="Zoom out">−</button><span id="zoom-label">100%</span><button id="zoom-in" aria-label="Zoom in">+</button><label class="sr-only" for="zoom-mode">Page fit</label><select id="zoom-mode"><option value="page-width">Fit width</option><option value="page-fit">Fit page</option><option value="1">100%</option></select></div><div class="control-group search-group"><label class="sr-only" for="document-search">Search document</label><input id="document-search" type="search" placeholder="Search document…"><span id="search-count" role="status"></span><button id="find-next" aria-label="Next search result">↓</button></div><div class="control-group document-actions"><button id="save-document" disabled>Save changes</button><button id="download-document" disabled>↓ Download</button></div></div>
<div class="document-info"><span id="document-status" role="status" aria-live="polite">Loading…</span><span>Original PDF preserved</span></div><div class="pdf-stage"><div id="viewer-message" role="alert">Loading…</div><div id="pdf-container"><div id="pdf-pages" class="pdfViewer"></div></div></div></main>
<dialog id="dialog"><div class="dialogtop"><h2 id="dialogtitle"></h2><button id="close" aria-label="Close dialog" title="Close dialog">✕ Close</button></div><div id="dialogbody"></div><p id="dialogerror" role="alert"></p></dialog>
</body></html>
